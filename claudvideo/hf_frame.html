<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>claudvideo</title>
<script src="gsap.min.js"></script>
<style>
:root {
  --bg: #0B1020; --panel: #151B34; --text: #F4F6FF; --muted: #8A93B8;
  --cyan: #38BDF8; --amber: #FBBF24; --pink: #F472B6;
  --green: #34D399; --red: #F87171; --violet: #A78BFA;
  --font: system-ui, sans-serif;
}
html, body { margin: 0; padding: 0; background: var(--bg); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font); }
#bg {
  position: absolute; inset: 0;
  background: radial-gradient(1300px 1000px at 50% 28%, #1B2552 0%, #0B1020 72%);
}
#grid {
  position: absolute; left: 0; top: 190px; width: 1080px; height: 1150px;
  background-image:
    linear-gradient(rgba(130,150,255,.07) 2px, transparent 2px),
    linear-gradient(90deg, rgba(130,150,255,.07) 2px, transparent 2px);
  background-size: 60px 60px;
  -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
          mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
}
#progress {
  position: absolute; left: 0; top: 0; width: 1080px; height: 8px; background: var(--cyan);
  transform-origin: 0 50%;
}
#title-wrap { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: center; }
#title {
  display: block; max-width: 940px; padding: 14px 36px; border-radius: 999px; box-sizing: border-box;
  background: rgba(255,255,255,.08); color: var(--text);
  font-size: 38px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scene { position: absolute; left: 0; top: 190px; width: 1080px; height: 1150px; overflow: hidden; }
.scene-inner { position: absolute; inset: 0; }
.scene svg { display: block; width: 1080px; height: 1150px; }
.scene svg text { font-family: var(--font); }
.sub {
  position: absolute; left: 60px; right: 60px; top: 1380px; height: 260px;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.sub-line {
  display: block; font-size: 66px; line-height: 1.2; font-weight: 800; color: #fff;
  text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 20px rgba(0,0,0,.65);
}
.sub-line.long { font-size: 56px; }
.sub-line .w { display: inline-block; margin: 0 .14em; }
</style>
</head>
<body>
<div id="root" data-composition-id="claudvideo" data-start="0"
     data-width="1080" data-height="1920" data-duration="/*__TOTAL__*/">
  <div id="bg"></div>
  <div id="grid"></div>
  <!--SCENES-->
  <!--SUBS-->
  <div id="title-wrap"><div id="title"></div></div>
  <div id="progress"></div>
  <audio id="voice" src="voice.wav" data-start="0" data-duration="/*__TOTAL__*/" data-track-index="9"></audio>
</div>
<script>
/*__DATA__*/
(function () {
  "use strict";
  const SVGNS = "http://www.w3.org/2000/svg";
  const TL = window.TL;
  const SHAPES = ["path", "line", "polyline", "polygon", "circle", "ellipse", "rect"];
  const SKIP = new Set(["defs", "stop", "lineargradient", "radialgradient", "marker", "clippath",
                        "mask", "filter", "pattern", "symbol", "title", "desc", "tspan"]);
  const tl = gsap.timeline({ paused: true });
  const end = TL.total;
  // повторы конечные: число полупериодов до конца ролика
  const reps = (from, period) => Math.max(1, Math.ceil(Math.max(0, end - from) / period));

  document.getElementById("title").textContent = TL.title;

  // ---- общий фон и рамка
  // плашка видна с первого кадра: он же обложка ролика в соцсетях
  tl.fromTo("#title", { scale: 1 }, { scale: 1.04, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.2);
  tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: end, ease: "none" }, 0);
  tl.fromTo("#grid", { backgroundPosition: "0px 0px" },
            { backgroundPosition: "0px " + Math.round(end * 12) + "px", duration: end, ease: "none" }, 0);

  // ---- сцены
  TL.scenes.forEach((sc, i) => {
    const root = document.getElementById("scene-" + i);
    const inner = root.querySelector(".scene-inner");
    const svg = root.querySelector("svg");
    const last = i === TL.scenes.length - 1;
    const sceneEnd = last ? end : sc.end;

    // смена сцен: новая въезжает снизу и проявляется из лёгкой расфокусировки масштаба
    if (i > 0) {
      tl.fromTo(inner, { opacity: 0, y: 70, scale: 1.04 },
                { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, sc.start);
    }
    if (!last) {
      tl.to(inner, { opacity: 0, y: -50, scale: 0.97, duration: 0.28, ease: "power2.in" }, sc.end - 0.28);
    }

    let order = 0;
    svg.querySelectorAll("[data-beat],[data-anim],[data-loop]").forEach(el => {
      const tag = el.localName.toLowerCase();
      if (SKIP.has(tag) || el.closest("defs")) return;
      // два обёрточных <g>: внешний для появления, внутренний для постоянного движения,
      // чтобы анимации не спорили за transform и не трогали собственный transform элемента
      const enter = document.createElementNS(SVGNS, "g");
      const loopG = document.createElementNS(SVGNS, "g");
      el.parentNode.insertBefore(enter, el);
      enter.appendChild(loopG);
      loopG.appendChild(el);

      const beat = el.hasAttribute("data-beat") ? parseInt(el.getAttribute("data-beat"), 10) : null;
      const anim = el.getAttribute("data-anim") || (beat === null ? null : (tag === "text" ? "slide" : "pop"));
      const loop = el.getAttribute("data-loop");
      const delay = parseFloat(el.getAttribute("data-delay") || "0") || 0;
      let t0 = sc.start + 0.15;
      if (beat !== null && sc.beats[beat]) t0 = sc.beats[beat].start - 0.05;
      t0 = Math.max(sc.start, t0 + delay);
      const shapes = SHAPES.includes(tag) ? [el] : Array.from(el.querySelectorAll(SHAPES.join(",")));
      const geo = shapes.filter(s => typeof s.getTotalLength === "function");
      const origin = { transformOrigin: "50% 50%" };

      switch (anim) {
        case "fade":
          tl.fromTo(enter, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, t0);
          break;
        case "pop":
          gsap.set(enter, origin);
          tl.fromTo(enter, { opacity: 0, scale: 0.55 },
                    { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, t0);
          break;
        case "slide":
          tl.fromTo(enter, { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t0);
          break;
        case "draw": {
          tl.fromTo(enter, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
          geo.forEach((s, k) => {
            const len = s.getTotalLength();
            if (!(len > 0)) return;
            const fo = parseFloat(getComputedStyle(s).fillOpacity);
            const fillOp = isNaN(fo) ? 1 : fo;
            tl.fromTo(s, { strokeDasharray: len, strokeDashoffset: len },
                      { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, t0 + k * 0.08);
            tl.fromTo(s, { fillOpacity: 0 }, { fillOpacity: fillOp, duration: 0.45, ease: "power1.out" }, t0 + 0.55);
          });
          break;
        }
      }

      // постоянное оживление начинается, когда элемент проявился
      const ls = anim ? t0 + 0.4 : sc.start;
      const phase = (order++ % 5) * 0.17;
      switch (loop) {
        case "pulse":
          gsap.set(loopG, origin);
          tl.fromTo(loopG, { scale: 1 }, { scale: 1.06, duration: 0.7, ease: "sine.inOut", yoyo: true,
                                           repeat: reps(ls, 0.7) }, ls + phase);
          break;
        case "float":
          tl.fromTo(loopG, { y: -9 }, { y: 9, duration: 1.3, ease: "sine.inOut", yoyo: true,
                                        repeat: reps(ls, 1.3) }, ls + phase);
          break;
        case "wiggle":
          gsap.set(loopG, origin);
          tl.fromTo(loopG, { rotation: -5 }, { rotation: 5, duration: 0.6, ease: "sine.inOut", yoyo: true,
                                               repeat: reps(ls, 0.6) }, ls + phase);
          break;
        case "spin":
          gsap.set(loopG, origin);
          tl.fromTo(loopG, { rotation: 0 }, { rotation: 60 * (sceneEnd - ls), duration: Math.max(0.1, sceneEnd - ls),
                                              ease: "none" }, ls);
          break;
        case "flow":
          geo.forEach(s => {
            tl.fromTo(s, { strokeDashoffset: 0 }, { strokeDashoffset: -60 * (sceneEnd - ls),
                                                    duration: Math.max(0.1, sceneEnd - ls), ease: "none" }, ls);
          });
          break;
      }
    });
  });

  // ---- субтитры: фраза всплывает, текущее слово подсвечивается
  TL.subs.forEach((b, i) => {
    const line = document.querySelector("#sub-" + i + " .sub-line");
    tl.fromTo(line, { opacity: 0, y: 26, scale: 0.96 },
              { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power3.out" }, b.start);
    const words = line.querySelectorAll(".w");
    b.words.forEach((w, j) => {
      const el = words[j];
      if (!el) return;
      const next = j + 1 < b.words.length ? b.words[j + 1].start : b.end;
      tl.to(el, { color: "#FBBF24", scale: 1.08, duration: 0.1, ease: "power2.out" }, w.start);
      if (j + 1 < b.words.length)
        tl.to(el, { color: "#FFFFFF", scale: 1, duration: 0.14, ease: "power2.out" }, Math.max(w.start + 0.1, next));
    });
  });

  window.__timelines["claudvideo"] = tl;
})();
</script>
</body>
</html>
